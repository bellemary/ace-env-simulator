plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ace.envsimulator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ace.envsimulator'
        minSdk 24
        targetSdk 34
        versionCode 206
        versionName '2.6'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    defaultConfig {
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "ACE环境检测模拟器-v${android.defaultConfig.versionName}-${variant.buildType.name}.apk"
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
}
